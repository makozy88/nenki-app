<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="年忌計算">
  <meta name="apple-mobile-web-app-title" content="年忌計算">
  <meta name="theme-color" content="#34574b">
  <title>年忌計算</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f3ee; color: #25352e; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.6; }
    main { width: min(100%, 560px); margin: 0 auto; padding: 32px 16px 28px; }
    header { border-top: 4px solid #34574b; padding-top: 18px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: .12em; }
    h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    select { display: block; width: 100%; min-height: 60px; padding: 12px 36px 12px 14px; border: 1px solid #8b9c92; border-radius: 8px; background: #fff; color: #25352e; font: inherit; font-size: 18px; cursor: pointer; }
    select:focus-visible { outline: 3px solid #668b78; outline-offset: 3px; }
    .results { margin-top: 28px; border: 1px solid #d9dfd7; border-radius: 10px; overflow: hidden; background: #fff; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 18px; }
    caption { text-align: left; padding: 14px 12px; font-size: 16px; color: #53645a; border-bottom: 1px solid #d9dfd7; }
    th, td { padding: 15px 8px; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
    thead { background: #34574b; color: #fff; }
    thead th { font-size: 15px; font-weight: 500; }
    thead th:nth-child(1) { width: 29%; }
    thead th:nth-child(2) { width: 29%; }
    thead th:nth-child(3) { width: 42%; }
    tbody th { font-weight: 600; }
    tbody tr + tr { border-top: 1px solid #e4e8e1; }
    tbody tr:nth-child(even) { background: #f7f8f4; }
    .note { margin: 14px 2px 0; color: #627066; font-size: 13px; }
    @media (max-width: 360px) { main { padding-inline: 12px; } th, td { padding-inline: 6px; } table { font-size: 16px; } select { font-size: 16px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>年忌計算</h1></header>
    <section aria-labelledby="year-heading">
      <h2 id="year-heading"><label for="death-year">亡くなられた年を選択してください</label></h2>
      <select id="death-year" aria-controls="results"></select>
    </section>
    <div class="results" id="results" aria-live="polite" aria-atomic="true">
      <table>
        <caption id="result-caption"></caption>
        <thead><tr><th scope="col">年忌</th><th scope="col">西暦</th><th scope="col">元号</th></tr></thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
    <p class="note">※将来の年は、現在の元号が続くものとして表示しています。</p>
    <noscript>計算結果の表示には、ブラウザのJavaScriptを有効にしてください。</noscript>
  </main>
  <script>
    'use strict';
    const eras = [
      { name: '明治', start: 1868 },
      { name: '大正', start: 1912 },
      { name: '昭和', start: 1926 },
      { name: '平成', start: 1989 },
      { name: '令和', start: 2019 }
    ];
    function formatEra(year) {
      // 改元年は、終了する元号と始まる元号の両方を表示する。
      return eras.filter((era, index) => year >= era.start &&
        (index === eras.length - 1 || year <= eras[index + 1].start))
        .map(era => era.name + (year === era.start ? '元' : year - era.start + 1) + '年')
        .join('／');
    }
    const memorials = [
      ['一周忌', 1], ['三回忌', 2], ['七回忌', 6], ['十三回忌', 12],
      ['十七回忌', 16], ['二十三回忌', 22], ['二十七回忌', 26],
      ['三十三回忌', 32], ['三十七回忌', 36], ['五十回忌', 49]
    ];
    const yearSelect = document.getElementById('death-year');
    const resultBody = document.getElementById('result-body');
    const currentYear = new Date().getFullYear();
    for (let year = currentYear; year >= 1900; year--) {
      const option = document.createElement('option');
      option.value = String(year);
      option.textContent = `${year}年（${formatEra(year)}）`;
      yearSelect.append(option);
    }
    function updateResults() {
      const deathYear = Number(yearSelect.value);
      document.getElementById('result-caption').textContent = `${deathYear}年没の年忌一覧`;
      resultBody.replaceChildren();
      for (const [name, offset] of memorials) {
        const year = deathYear + offset;
        const row = document.createElement('tr');
        const label = document.createElement('th');
        label.scope = 'row';
        label.textContent = name;
        const western = document.createElement('td');
        western.textContent = `${year}年`;
        const era = document.createElement('td');
        era.textContent = formatEra(year);
        row.append(label, western, era);
        resultBody.append(row);
      }
    }
    yearSelect.value = String(currentYear);
    yearSelect.addEventListener('change', updateResults);
    updateResults();
  </script>
</body>
</html>
